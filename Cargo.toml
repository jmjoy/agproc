[package]
name = "agproc"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["jmjoy <jmjoy@apache.org>"]
description = "Dev-time process manager for AI agents and humans: build, run and probe your services from one agproc.toml"
repository = "https://github.com/jmjoy/agproc"
readme = "README.md"
license = "MulanPSL-2.0"
keywords = ["process-manager", "dev-server", "ai-agent", "supervisor"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["examples/", ".agproc"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
nix = { version = "0.31.3", features = ["term", "process", "signal", "fs", "poll"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"
